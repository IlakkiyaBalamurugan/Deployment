name: Deploy to Azure App Service

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment (e.g., dev, staging, production)'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - production
      inputs:
      ICI_Version:
       required: true
        
jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
     
      - name: Set environment-specific variables
        id: vars
        run: |
          echo "ENVIRONMENT=${{ github.event.inputs.environment }}" >> $GITHUB_ENV
          case $ENVIRONMENT in
            dev)
              echo "JFROG_URL=https://jfrog.dev.example.com/artifactory" >> $GITHUB_ENV
              echo "AZURE_APP_NAME=my-app-dev" >> $GITHUB_ENV
              echo "AZURE_PUBLISH_PROFILE=${{ secrets.AZURE_PUBLISH_PROFILE_DEV }}" >> $GITHUB_ENV
              ;;
            staging)
              echo "JFROG_URL=https://jfrog.staging.example.com/artifactory" >> $GITHUB_ENV
              echo "AZURE_APP_NAME=my-app-staging" >> $GITHUB_ENV
              echo "AZURE_PUBLISH_PROFILE=${{ secrets.AZURE_PUBLISH_PROFILE_STAGING }}" >> $GITHUB_ENV
              ;;
            production)
              echo "JFROG_URL=https://jfrog.prod.example.com/artifactory" >> $GITHUB_ENV
              echo "AZURE_APP_NAME=my-app-prod" >> $GITHUB_ENV
              echo "AZURE_PUBLISH_PROFILE=${{ secrets.AZURE_PUBLISH_PROFILE_PROD }}" >> $GITHUB_ENV
              ;;
            *)
              echo "Invalid environment" >&2
              exit 1
              ;;
          esac

      - name: Fetch artifact from JFrog Artifactory
        env:
          JFROG_URL: ${{ env.JFROG_URL }}
          JFROG_API_KEY: ${{ secrets.JFROG_API_KEY }}
        run: |
          curl -u $JFROG_API_KEY: \
               -O "$JFROG_URL/path/to/artifact.tar.gz"

      - name: Extract artifact
        run: |
          tar -xzf artifact.tar.gz

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ env.AZURE_APP_NAME }}
          publish-profile: ${{ env.AZURE_PUBLISH_PROFILE }}
          package: './path/to/extracted/artifact'
